<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="component-diagram-title component-diagram-desc">
  <title id="component-diagram-title">AutoVision Studio コンポーネント図</title>
  <desc id="component-diagram-desc">Renderer UI、Preload APIs、Shared Contracts、Main Services、Local Persistence、Python Commands、ML Domain、Packaging / Resources の責務と許可された依存方向を示す。青の実線は実装済み、紫の破線は設計確定・未実装、灰色の点線は検証待ち、緑の二重枠は外部入力または OS 資源を表す。Renderer から Main、filesystem、Python への直接依存はなく、Shared Contracts は business logic を持たない。</desc>

  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1457B8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6F2DA8"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#FFFFFF"/>
  <text x="30" y="31" font-family="sans-serif" font-size="24" font-weight="700" fill="#17202A">AutoVision Studio — 論理コンポーネントと依存方向</text>
  <text x="30" y="55" font-family="sans-serif" font-size="13" fill="#344054">2026-09-04 現在。ラベルと枠線で現行実装、目標設計、検証待ち、外部資源を区別する。</text>

  <!-- Status legend -->
  <g aria-label="状態凡例">
    <rect x="30" y="72" width="252" height="40" rx="6" fill="#EAF2FF" stroke="#1457B8" stroke-width="2"/>
    <text x="44" y="97" font-family="sans-serif" font-size="13" font-weight="700" fill="#123A70">実装済み（青・実線）</text>

    <rect x="298" y="72" width="270" height="40" rx="6" fill="#F5EDFF" stroke="#6F2DA8" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="312" y="97" font-family="sans-serif" font-size="13" font-weight="700" fill="#4D1F75">設計確定・未実装（紫・破線）</text>

    <rect x="584" y="72" width="270" height="40" rx="6" fill="#F2F4F7" stroke="#59636E" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="598" y="97" font-family="sans-serif" font-size="13" font-weight="700" fill="#343A40">検証待ち／Gate 待ち（灰・点線）</text>

    <rect x="870" y="72" width="300" height="40" rx="6" fill="#EAF7EE" stroke="#1F7A3E" stroke-width="2"/>
    <rect x="875" y="77" width="290" height="30" rx="3" fill="none" stroke="#1F7A3E" stroke-width="1.5"/>
    <text x="888" y="97" font-family="sans-serif" font-size="13" font-weight="700" fill="#14532D">外部入力／OS 資源（緑・二重枠）</text>
  </g>

