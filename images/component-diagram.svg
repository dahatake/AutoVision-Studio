  <!-- Boundary rules -->
  <rect x="25" y="692" width="1150" height="51" rx="8" fill="#FFF8E8" stroke="#8A5A00" stroke-width="1.5"/>
  <text x="42" y="713" font-family="sans-serif" font-size="12" font-weight="700" fill="#5D3A00">境界ルール</text>
  <text x="132" y="713" font-family="sans-serif" font-size="12" fill="#3E3526">Renderer → Main / filesystem / Python の直接依存は禁止。Main が DB と Project files の唯一の writer。</text>
  <text x="42" y="733" font-family="sans-serif" font-size="12" fill="#3E3526">Shared Contracts は型・runtime schema・versioned envelope の境界であり、business logic、filesystem access、UI state を持たない。</text>
