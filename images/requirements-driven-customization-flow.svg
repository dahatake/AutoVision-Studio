<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="requirements-flow-title requirements-flow-desc" lang="ja">
  <title id="requirements-flow-title">要求駆動カスタマイズフロー</title>
  <desc id="requirements-flow-desc">変更要求から要求 ID、対象と非対象、実装タスクと Gate、ADR とアーキテクチャ境界、コードとテスト、敵対的レビュー、利用者向けガイドとアーキテクチャ更新、トレーサビリティ、Gate と PR 証拠までを追跡するフロー。対応要求がない場合は要求変更レビューへ戻り、アーキテクチャ決定を変える場合はコード変更前に ADR を更新する。利用者に見えない変更でもアーキテクチャとトレーサビリティへの影響を判定する。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#243447"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#FFFFFF"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#172333">要求駆動カスタマイズフロー</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#3D4A59">要求 → task → code → test → docs → evidence を切れ目なく追跡する</text>

  <!-- Main flow, first row -->
  <rect x="25" y="88" width="170" height="76" rx="10" fill="#E8F6EC" stroke="#2E7D4F" stroke-width="2"/>
  <rect x="31" y="94" width="158" height="64" rx="7" fill="none" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="110" y="119" text-anchor="middle" font-size="16" font-weight="700" fill="#173E29">Change Request</text>
  <text x="110" y="142" text-anchor="middle" font-size="12" fill="#173E29">外部入力</text>

  <polygon points="300,84 397,126 300,168 203,126" fill="#E8F1FF" stroke="#1557A0" stroke-width="2"/>
  <text x="300" y="119" text-anchor="middle" font-size="15" font-weight="700" fill="#123E70">Requirement ID</text>
  <text x="300" y="140" text-anchor="middle" font-size="12" fill="#123E70">対応要求はあるか</text>

  <rect x="415" y="88" width="170" height="76" rx="10" fill="#E8F1FF" stroke="#1557A0" stroke-width="2"/>
  <text x="500" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#123E70">Scope / Non-scope</text>
  <text x="500" y="140" text-anchor="middle" font-size="12" fill="#123E70">対象・非対象を記録</text>

  <rect x="605" y="88" width="135" height="76" rx="10" fill="#F2F4F7" stroke="#59636E" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="672.5" y="117" text-anchor="middle" font-size="15" font-weight="700" fill="#303942">Task / Gate</text>
  <text x="672.5" y="140" text-anchor="middle" font-size="12" fill="#303942">依存と停止条件</text>

  <polygon points="920,78 1082,126 920,174 758,126" fill="#E8F1FF" stroke="#1557A0" stroke-width="2"/>
  <text x="920" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#123E70">ADR / Architecture 境界</text>
  <text x="920" y="138" text-anchor="middle" font-size="12" fill="#123E70">設計判断を変えるか</text>

  <path d="M195 126 H203" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M397 126 H415" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="406" y="116" text-anchor="middle" font-size="11" font-weight="700" fill="#243447">あり</text>
  <path d="M585 126 H605" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M740 126 H758" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- No-requirement return branch -->
  <path d="M300 168 V204" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="311" y="190" font-size="11" font-weight="700" fill="#243447">なし</text>
  <rect x="195" y="210" width="210" height="68" rx="10" fill="#F3ECFF" stroke="#6F42A5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="300" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#4D2B78">Requirement Change Review</text>
  <text x="300" y="258" text-anchor="middle" font-size="12" fill="#4D2B78">要求変更を独立 review</text>
  <path d="M195 244 H150 V188 H270 V168" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="153" y="181" font-size="11" fill="#243447">承認後に ID 採番</text>

  <!-- Architecture-decision branches before code -->
  <rect x="720" y="218" width="205" height="66" rx="10" fill="#F3ECFF" stroke="#6F42A5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="822.5" y="244" text-anchor="middle" font-size="15" font-weight="700" fill="#4D2B78">ADR 更新</text>
  <text x="822.5" y="265" text-anchor="middle" font-size="12" fill="#4D2B78">実装より先に review</text>
  <path d="M842 151 L820 181 V218" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="818" y="184" text-anchor="end" font-size="11" font-weight="700" fill="#243447">変える</text>

  <rect x="965" y="306" width="200" height="76" rx="10" fill="#F3ECFF" stroke="#6F42A5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1065" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#4D2B78">Code + Test</text>
  <text x="1065" y="358" text-anchor="middle" font-size="12" fill="#4D2B78">正常・境界・失敗・敵対入力</text>
  <path d="M998 149 L1098 203 V306" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1054" y="194" font-size="11" font-weight="700" fill="#243447">変えない</text>
  <path d="M925 251 H943 V344 H965" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="935" y="296" text-anchor="end" font-size="11" fill="#243447">ADR 承認後</text>

  <!-- Main flow, second row -->
  <rect x="735" y="306" width="190" height="76" rx="10" fill="#F2F4F7" stroke="#59636E" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="830" y="335" text-anchor="middle" font-size="15" font-weight="700" fill="#303942">Adversarial Review</text>
  <text x="830" y="358" text-anchor="middle" font-size="12" fill="#303942">指摘・裁定・再実行を閉じる</text>
  <path d="M965 344 H925" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>

  <polygon points="610,302 715,344 610,386 505,344" fill="#F3ECFF" stroke="#6F42A5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="610" y="337" text-anchor="middle" font-size="15" font-weight="700" fill="#4D2B78">User-visible?</text>
  <text x="610" y="358" text-anchor="middle" font-size="12" fill="#4D2B78">利用者に見える変更か</text>
  <path d="M735 344 H715" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="630" y="414" width="285" height="68" rx="10" fill="#F3ECFF" stroke="#6F42A5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="772.5" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#4D2B78">Architecture / Traceability</text>
  <text x="772.5" y="461" text-anchor="middle" font-size="12" fill="#4D2B78">影響と「更新不要」の根拠を判定</text>
  <path d="M610 386 V397 H772 V414" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="624" y="401" font-size="11" font-weight="700" fill="#243447">いいえ</text>

  <rect x="350" y="446" width="250" height="78" rx="10" fill="#F3ECFF" stroke="#6F42A5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="475" y="473" text-anchor="middle" font-size="14" font-weight="700" fill="#4D2B78">User Guide / Architecture 更新</text>
  <text x="475" y="494" text-anchor="middle" font-size="12" fill="#4D2B78">該当文書を更新</text>
  <text x="475" y="511" text-anchor="middle" font-size="11" fill="#4D2B78">非該当なら更新不要理由を記録</text>
  <path d="M535 373 L500 410 V446" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="516" y="414" text-anchor="end" font-size="11" font-weight="700" fill="#243447">はい</text>
  <path d="M630 448 H615 V485 H600" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="175" y="446" width="150" height="78" rx="10" fill="#F3ECFF" stroke="#6F42A5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="250" y="477" text-anchor="middle" font-size="15" font-weight="700" fill="#4D2B78">Traceability</text>
  <text x="250" y="499" text-anchor="middle" font-size="11" fill="#4D2B78">requirement → evidence</text>
  <path d="M350 485 H325" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="20" y="446" width="130" height="78" rx="10" fill="#F2F4F7" stroke="#59636E" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="85" y="476" text-anchor="middle" font-size="14" font-weight="700" fill="#303942">Gate / PR</text>
  <text x="85" y="497" text-anchor="middle" font-size="12" fill="#303942">evidence</text>
  <path d="M175 485 H150" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Guardrail notes -->
  <rect x="955" y="414" width="220" height="110" rx="8" fill="#FFF8E5" stroke="#8A6412" stroke-width="1.5"/>
  <text x="1065" y="439" text-anchor="middle" font-size="13" font-weight="700" fill="#5A420E">停止規則</text>
  <text x="970" y="462" font-size="11" fill="#5A420E">• 要求・依存 Gate が未確定なら停止</text>
  <text x="970" y="482" font-size="11" fill="#5A420E">• ADR 更新の承認前に実装しない</text>
  <text x="970" y="502" font-size="11" fill="#5A420E">• 未実行の検証を合格にしない</text>

  <!-- Shared status legend -->
  <rect x="20" y="574" width="1160" height="142" rx="10" fill="#FAFBFC" stroke="#AAB2BD" stroke-width="1.5"/>
  <text x="42" y="602" font-size="15" font-weight="700" fill="#172333">状態凡例（全図共通）</text>

  <rect x="45" y="620" width="44" height="27" rx="5" fill="#E8F1FF" stroke="#1557A0" stroke-width="2"/>
  <text x="101" y="638" font-size="12" font-weight="700" fill="#172333">実装済み：青・実線</text>

  <rect x="320" y="620" width="44" height="27" rx="5" fill="#F3ECFF" stroke="#6F42A5" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="376" y="638" font-size="12" font-weight="700" fill="#172333">設計確定・未実装：紫・破線</text>

  <rect x="655" y="620" width="44" height="27" rx="5" fill="#F2F4F7" stroke="#59636E" stroke-width="2" stroke-dasharray="2 5"/>
  <text x="711" y="638" font-size="12" font-weight="700" fill="#172333">検証待ち／Gate 待ち：灰・点線</text>

  <rect x="985" y="616" width="50" height="35" rx="6" fill="#E8F6EC" stroke="#2E7D4F" stroke-width="2"/>
  <rect x="990" y="621" width="40" height="25" rx="3" fill="none" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="1047" y="638" font-size="12" font-weight="700" fill="#172333">外部入力または OS 資源：緑・二重枠</text>

  <line x1="45" y1="678" x2="112" y2="678" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="124" y="682" font-size="12" fill="#172333">実施順序</text>
  <text x="285" y="682" font-size="12" fill="#172333">分岐ラベルは判断結果を示し、色だけに依存しない</text>

  <text x="600" y="742" text-anchor="middle" font-size="11" fill="#52606D">根拠: docs/requirement-definition.md、docs/implementation-plan.md §4 / §9、CONTRIBUTING.md §1〜§5</text>
</svg>
