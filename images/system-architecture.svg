<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="system-architecture-title system-architecture-desc">
  <title id="system-architecture-title">AutoVision Studio 実行時システムアーキテクチャと信頼境界</title>
  <desc id="system-architecture-desc">非信頼の React Renderer から限定 Preload API と検証済み IPC を経て Electron Main に至る制御経路、Main だけが SQLite を更新する目標設計、Project Files、OS API、短命な Job Worker と一時的な Inference Worker、機械学習基盤を示す。青実線は実装済み、紫破線は設計確定・未実装、灰点線は検証待ち、緑二重枠は利用者または OS 資源である。Python はデータベースを直接更新せず、カメラフレームは既定で保存しない。</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#075985"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#6b21a8"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#166534"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>
  <text x="32" y="38" font-size="25" font-weight="700" fill="#111827">AutoVision Studio 実行時アーキテクチャ</text>
  <text x="32" y="62" font-size="14" fill="#374151">現行 production source と目標設計を分離表示（2026-09-04）</text>

  <g aria-label="状態凡例">
    <rect x="430" y="17" width="738" height="70" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
    <text x="446" y="40" font-size="14" font-weight="700" fill="#111827">凡例</text>
    <rect x="500" y="26" width="34" height="22" fill="#eff6ff" stroke="#075985" stroke-width="3"/>
    <text x="542" y="42" font-size="13" fill="#111827">実装済み（青・実線）</text>
    <rect x="700" y="26" width="34" height="22" fill="#faf5ff" stroke="#6b21a8" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="742" y="42" font-size="13" fill="#111827">設計確定・未実装（紫・破線）</text>
    <rect x="965" y="26" width="34" height="22" fill="#f3f4f6" stroke="#4b5563" stroke-width="3" stroke-dasharray="2 6"/>
    <text x="1007" y="42" font-size="13" fill="#111827">検証待ち</text>
    <rect x="500" y="55" width="34" height="22" fill="#f0fdf4" stroke="#166534" stroke-width="2.5"/>
    <rect x="504" y="59" width="26" height="14" fill="none" stroke="#166534" stroke-width="1.5"/>
    <text x="542" y="71" font-size="13" fill="#111827">外部入力／OS 資源（緑・二重枠）</text>
    <line x1="840" y1="66" x2="875" y2="66" stroke="#374151" stroke-width="3"/>
    <text x="884" y="71" font-size="13" fill="#111827">矢印＝データ／制御方向</text>
  </g>

  <g aria-label="利用者">
    <rect x="28" y="218" width="132" height="86" rx="10" fill="#f0fdf4" stroke="#166534" stroke-width="3"/>
    <rect x="34" y="224" width="120" height="74" rx="7" fill="none" stroke="#166534" stroke-width="1.5"/>
    <circle cx="94" cy="246" r="10" fill="none" stroke="#111827" stroke-width="2"/>
    <path d="M72 282 Q94 256 116 282" fill="none" stroke="#111827" stroke-width="2"/>
    <text x="94" y="295" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">利用者</text>
  </g>

  <g aria-label="React Renderer 非信頼領域">
    <rect x="190" y="176" width="184" height="170" rx="9" fill="#eff6ff" stroke="#075985" stroke-width="3"/>
    <text x="282" y="203" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">React Renderer</text>
    <rect x="208" y="214" width="148" height="24" rx="12" fill="#111827"/>
    <text x="282" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">非信頼領域</text>
    <text x="282" y="258" text-anchor="middle" font-size="13" fill="#111827">現行: shell / 11 見出し</text>
    <text x="282" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">実装済み</text>
    <rect x="208" y="291" width="148" height="39" rx="5" fill="#faf5ff" stroke="#6b21a8" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="282" y="307" text-anchor="middle" font-size="12" fill="#111827">機能 UI / draft state</text>
    <text x="282" y="323" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">設計済み・未実装</text>
  </g>

  <g aria-label="Electron Preload">
    <rect x="410" y="176" width="154" height="170" rx="9" fill="#eff6ff" stroke="#075985" stroke-width="3"/>
    <text x="487" y="203" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Electron Preload</text>
    <text x="487" y="233" text-anchor="middle" font-size="13" fill="#111827">frozen narrow API</text>
    <text x="487" y="254" text-anchor="middle" font-size="12" fill="#111827">現行: contractVersion</text>
    <text x="487" y="273" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">のみ実装済み</text>
    <rect x="425" y="291" width="124" height="39" rx="5" fill="#faf5ff" stroke="#6b21a8" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="487" y="307" text-anchor="middle" font-size="12" fill="#111827">feature APIs</text>
    <text x="487" y="323" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">未実装</text>
  </g>

  <g aria-label="Electron Main 信頼領域">
    <rect x="606" y="142" width="224" height="238" rx="10" fill="#eff6ff" stroke="#075985" stroke-width="3"/>
    <text x="718" y="171" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Electron Main</text>
    <rect x="631" y="183" width="174" height="25" rx="12" fill="#075985"/>
    <text x="718" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">信頼領域</text>
    <text x="718" y="231" text-anchor="middle" font-size="13" fill="#111827">lifecycle / secure window</text>
    <text x="718" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">実装済み</text>
    <rect x="626" y="270" width="184" height="90" rx="6" fill="#faf5ff" stroke="#6b21a8" stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="718" y="291" text-anchor="middle" font-size="13" fill="#111827">feature services / 検証</text>
    <text x="718" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">唯一の DB writer</text>
    <text x="718" y="334" text-anchor="middle" font-size="12" fill="#111827">commit / worker supervision</text>
    <text x="718" y="351" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">設計済み・未実装</text>
  </g>

  <g aria-label="SQLite">
    <rect x="928" y="112" width="202" height="83" rx="8" fill="#faf5ff" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6"/>
