    <text x="1029" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">未実装</text>
  </g>

  <g aria-label="Project Files">
    <rect x="928" y="231" width="202" height="83" rx="8" fill="#faf5ff" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6"/>
    <path d="M958 256 H992 L1002 266 H1098 V294 H958 Z" fill="#ffffff" stroke="#6b21a8" stroke-width="2"/>
    <text x="1029" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Project Files</text>
    <text x="1029" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">正規領域は Main が commit</text>
  </g>

  <g aria-label="OS API とカメラ入力">
    <rect x="928" y="350" width="202" height="92" rx="9" fill="#f0fdf4" stroke="#166534" stroke-width="3"/>
    <rect x="934" y="356" width="190" height="80" rx="6" fill="none" stroke="#166534" stroke-width="1.5"/>
    <text x="1029" y="381" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">OS APIs</text>
    <text x="1029" y="403" text-anchor="middle" font-size="13" fill="#111827">filesystem / process / camera</text>
    <text x="1029" y="424" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">外部入力・OS 資源</text>
  </g>

  <g aria-label="Python Job Worker">
    <rect x="477" y="486" width="250" height="111" rx="9" fill="#faf5ff" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="602" y="514" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Python Job Worker</text>
    <text x="602" y="536" text-anchor="middle" font-size="13" fill="#111827">job ごとの短命 process</text>
    <text x="602" y="557" text-anchor="middle" font-size="12" fill="#111827">scan / assist / train / export</text>
    <rect x="516" y="570" width="172" height="19" rx="9" fill="#eff6ff" stroke="#075985" stroke-width="1.5"/>
    <text x="602" y="584" text-anchor="middle" font-size="11" font-weight="700" fill="#075985">現行は health CLI のみ実装</text>
  </g>

  <g aria-label="Python Inference Worker">
    <rect x="797" y="486" width="250" height="111" rx="9" fill="#faf5ff" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="922" y="514" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Python Inference Worker</text>
    <text x="922" y="536" text-anchor="middle" font-size="13" font-weight="700" fill="#6b21a8">一時的: 推論画面の間だけ</text>
    <text x="922" y="557" text-anchor="middle" font-size="12" fill="#111827">最新 frame 優先 / session 1 個</text>
    <rect x="842" y="570" width="160" height="19" rx="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="2 5"/>
    <text x="922" y="584" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">provider PoC のみ検証待ち</text>
  </g>

  <g aria-label="学習とエクスポート基盤">
    <rect x="477" y="654" width="250" height="70" rx="8" fill="#faf5ff" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="602" y="682" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">PyTorch / Optuna / ONNX</text>
    <text x="602" y="705" text-anchor="middle" font-size="12" font-weight="700" fill="#6b21a8">製品機能は未実装</text>
  </g>

  <g aria-label="推論ランタイムと実行プロバイダー">
    <rect x="797" y="654" width="250" height="70" rx="8" fill="#faf5ff" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6"/>
    <text x="922" y="682" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">ONNX Runtime / EP</text>
    <rect x="836" y="694" width="172" height="20" rx="9" fill="#f3f4f6" stroke="#4b5563" stroke-width="2" stroke-dasharray="2 5"/>
    <text x="922" y="708" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">DirectML / CoreML は検証待ち</text>
  </g>

  <!-- 実装済みの利用者操作と現行 narrow bridge -->
  <line x1="160" y1="261" x2="190" y2="261" stroke="#075985" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="175" y="249" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">操作・表示</text>
  <line x1="374" y1="246" x2="410" y2="246" stroke="#075985" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="392" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">限定 API</text>
  <text x="392" y="272" text-anchor="middle" font-size="10" fill="#374151">現行: version</text>

  <!-- 設計確定・未実装の feature IPC と永続化 -->
  <line x1="564" y1="261" x2="606" y2="261" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <text x="585" y="239" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">validated</text>
  <text x="585" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">IPC</text>

  <path d="M830 186 H884 V153 H928" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <path d="M928 174 H892 V207 H830" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <rect x="842" y="135" width="82" height="22" fill="#ffffff"/>
  <text x="883" y="151" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">read / write</text>

  <path d="M830 287 H928" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <path d="M928 304 H830" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <rect x="846" y="271" width="70" height="22" fill="#ffffff"/>
  <text x="881" y="287" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">read / commit</text>

  <line x1="830" y1="347" x2="928" y2="389" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <rect x="845" y="356" width="77" height="22" fill="#ffffff"/>
  <text x="883" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#166534">OS 操作</text>

  <!-- Worker spawn と protocol -->
  <path d="M660 380 V432 H602 V486" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <rect x="582" y="410" width="73" height="22" fill="#ffffff"/>
  <text x="618" y="426" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">spawn / job</text>

  <path d="M772 380 V424 H922 V486" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <rect x="788" y="408" width="110" height="22" fill="#ffffff"/>
  <text x="843" y="424" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">spawn + binary RGB</text>

  <path d="M797 532 H759 V397 H744" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <rect x="735" y="462" width="105" height="22" fill="#ffffff"/>
  <text x="787" y="478" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">NDJSON result</text>

  <path d="M727 552 H757 V458 H890 V314 H928" fill="none" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <rect x="744" y="438" width="137" height="22" fill="#ffffff"/>
  <text x="812" y="454" text-anchor="middle" font-size="11" font-weight="700" fill="#6b21a8">一時 job 成果物</text>

  <line x1="602" y1="597" x2="602" y2="654" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <text x="614" y="630" font-size="11" font-weight="700" fill="#6b21a8">使用</text>
  <line x1="922" y1="597" x2="922" y2="654" stroke="#6b21a8" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#arrow-purple)"/>
  <text x="934" y="630" font-size="11" font-weight="700" fill="#6b21a8">使用</text>

  <!-- 不変条件 -->
  <g aria-label="Python とデータベースの禁止依存">
    <rect x="30" y="397" width="398" height="92" rx="8" fill="#faf5ff" stroke="#6b21a8" stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="48" y="424" font-size="14" font-weight="700" fill="#6b21a8">目標設計の不変条件</text>
    <text x="48" y="450" font-size="14" font-weight="700" fill="#111827">Python worker は SQLite を直接更新しない</text>
    <text x="48" y="475" font-size="13" fill="#111827">一時成果物を Main が検証し、正規領域へ commit する</text>
  </g>

  <g aria-label="カメラフレーム非永続化">
    <rect x="30" y="516" width="398" height="81" rx="8" fill="#faf5ff" stroke="#6b21a8" stroke-width="2.5" stroke-dasharray="9 6"/>
    <text x="48" y="543" font-size="14" font-weight="700" fill="#6b21a8">カメラ frame（目標）</text>
    <text x="48" y="568" font-size="14" font-weight="700" fill="#111827">memory 上だけで処理し、既定では保存しない</text>
    <text x="48" y="588" font-size="12" fill="#111827">SQLite / Project Files / log へ frame を永続化しない</text>
  </g>

  <text x="30" y="741" font-size="12" fill="#374151">禁止依存: Renderer → filesystem / SQLite / Python、Python worker → SQLite / 正規 Project path の直接更新</text>
</svg>
