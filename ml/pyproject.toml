[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[project]
name = "autovision-ml"
version = "0.1.0"
description = "Local AutoVision Studio machine-learning worker"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[project.scripts]
autovision-ml = "autovision_ml.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
src = ["src", "tests"]
target-version = "py314"

[tool.uv]
package = true
required-version = "==0.12.9"
prerelease = "disallow"
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
