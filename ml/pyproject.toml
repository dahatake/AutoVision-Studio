[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[project]
name = "autovision-ml"
version = "0.1.0"
description = "Local AutoVision Studio machine-learning worker"
requires-python = ">=3.13,!=3.14.1,<3.15"
license = "MIT"
dependencies = [
  "onnx==1.22.0",
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
  "onnxruntime-directml==1.24.4; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
  "optuna==4.9.0",
  "torch==2.11.0",
  "torchvision==0.26.0",
]

[project.scripts]
autovision-ml = "autovision_ml.cli:main"

[dependency-groups]
dev = [
  "pip-audit==2.10.1",
  "pyinstaller==6.22.2",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
src = ["src", "tests"]
target-version = "py313"

[tool.uv]
package = true
required-version = "==0.12.9"
prerelease = "disallow"
environments = [
  "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
  "implementation_name == 'cpython' and sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
]
required-environments = [
  "implementation_name == 'cpython' and sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14'",
  "implementation_name == 'cpython' and sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "approved-pypi"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
