[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[project]
name = "autovision-ml"
version = "0.1.0"
description = "Local AutoVision Studio machine-learning worker"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[project.scripts]
autovision-ml = "autovision_ml.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.uv]
package = true
required-version = "==0.12.9"
prerelease = "disallow"
environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
